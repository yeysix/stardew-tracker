<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79502c"><link rel="manifest" href="manifest.json"><title>Stardew Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8c68c;color:#50301d;font:16px system-ui,sans-serif}header{background:#704323;color:#fff0c7;padding:20px;border-bottom:5px solid #a96d35}h1{margin:0;font-family:Georgia,serif}main{max-width:1200px;margin:auto;padding:16px}button,input,select{font:inherit;padding:9px;border:2px solid #a8753d;border-radius:6px;background:#fff1ce;color:#50301d}button{cursor:pointer;font-weight:600}button:hover{background:#f9d891}button.active{background:#55783d;color:white}section,dialog{background:#fff0ce;border:3px solid #a8753d;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 3px #b4844e}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.item{background:#ffe3ab;border:2px solid #bd8b4d;border-radius:8px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.item.done{background:#dce8b6}.item button{border:0;background:transparent;padding:0;width:100%}.item img,dialog img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}.item small{display:block}progress{width:100%;accent-color:#60863b;height:18px}dialog{max-width:480px;width:92%;color:inherit}dialog::backdrop{background:#0008}a{color:#42672e}label{display:inline-flex;align-items:center;gap:6px}input[type=checkbox]{width:20px;height:20px;accent-color:#60863b}.muted{font-size:13px;color:#805c3e}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.metric{padding:8px;background:#ffe3ab;border-radius:5px}h2{margin:0 0 10px} </style><header><h1>🌻 Stardew Tracker</h1>Tu granja, tu camino a la perfección</header><main><section><div class="controls"><select id="farm"></select><button id="new">+ Partida</button><button id="rename">Renombrar</button><button id="del">Eliminar</button><button id="export">Exportar</button><button id="import">Importar</button><input hidden type="file" id="file" accept="application/json"></div><div class="controls"><label>Año <input id="year" type="number" min="1" value="1" style="width:75px"></label><label>Estación <select id="season"><option>Primavera</option><option>Verano</option><option>Otoño</option><option>Invierno</option></select></label><label>Día <input id="day" type="number" min="1" max="28" style="width:75px"></label></div></section><section><h2 id="total"></h2><progress id="overall" max="100"></progress><p class="muted">Perfección: introducí los totales reales de las categorías incompletas según el rastreador de Qi. El catálogo inicial es parcial.</p><div id="summary"></div></section><nav id="nav"></nav><section><h2 id="heading"></h2><div id="calendar"></div><div class="controls"><input id="search" placeholder="Buscar objeto…"><select id="status"><option>Todos</option><option>Pendientes</option><option>Completados</option></select><select id="when"><option>Todas las estaciones</option><option>Primavera</option><option>Verano</option><option>Otoño</option><option>Invierno</option></select></div><div id="items" class="grid"></div></section></main><dialog id="detail"></dialog><script src="data.js"></script><script src="app.js"></script></html>
