<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79502c"><link rel="manifest" href="manifest.json"><title>Stardew Tracker</title><link rel="stylesheet" href="style.css"><header><h1>🌻 Stardew Tracker</h1>Tu granja, tu camino a la perfección</header><main><section id="farmPanel"><h2>Mi granja</h2><div class="controls"><select id="farm"></select><button id="new">+ Partida</button><button id="rename">Renombrar</button><button id="del">Eliminar</button><button id="export">Exportar</button><button id="import">Importar</button><input hidden type="file" id="file" accept="application/json"></div><div class="controls"><label>Año <input id="year" type="number" min="1" value="1" style="width:75px"></label><label>Estación <select id="season"><option>Primavera</option><option>Verano</option><option>Otoño</option><option>Invierno</option></select></label><label>Día <input id="day" type="number" min="1" max="28" style="width:75px"></label></div><h2>Calendario</h2><div id="today"></div></section><section id="progressPanel"><h2 id="total"></h2><progress id="overall" max="100"></progress><p class="muted">Perfección: introducí los totales reales de las categorías incompletas según el rastreador de Qi. El catálogo inicial es parcial.</p><div id="summary"></div></section><nav id="nav"></nav><section id="collectionPanel"><h2 id="heading"></h2><div id="calendar"></div><div class="controls"><input id="search" placeholder="Buscar objeto…"><select id="status"><option>Todos</option><option>Pendientes</option><option>Completados</option></select><select id="when"><option>Todas las estaciones</option><option>Primavera</option><option>Verano</option><option>Otoño</option><option>Invierno</option></select></div><div id="items" class="grid"></div></section></main><dialog id="detail"></dialog><script src="data.js"></script><script src="app.js"></script></html>
